<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | ShopNest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>


<main class="auth-wrap"><div class="container">
 <div class="text-center mb-4"><a class="navbar-brand" href="index.html">Shop<span class="text-dark">Nest</span></a></div>
 <div class="card auth-card"><div class="card-body">
  <h2 class="fw-bold mb-1">Create your account</h2><p class="muted mb-4">Join ShopNest and start exploring.</p>
  <form>
   <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" type="text" placeholder="Your full name" required></div>
   <div class="mb-3"><label class="form-label">Email address</label><input class="form-control" type="email" placeholder="you@example.com" required></div>
   <div class="mb-3"><label class="form-label">Mobile number</label><input class="form-control" type="tel" placeholder="+91 98765 43210"></div>
   <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" placeholder="Create a password" required></div>
   <div class="mb-4"><label class="form-label">Confirm password</label><input class="form-control" type="password" placeholder="Re-enter password" required></div>
   <button class="btn btn-primary w-100 py-2" type="submit">Create account</button>
  </form>
  <p class="text-center muted mt-4 mb-0">Already registered? <a href="login.html">Login</a></p>
 </div></div>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
