<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | ShopNest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body>


<main class="auth-wrap"><div class="container">
 <div class="text-center mb-4"><a class="navbar-brand" href="index.html">Shop<span class="text-dark">Nest</span></a></div>
 <div class="card auth-card"><div class="card-body">
  <h2 class="fw-bold mb-1">Welcome back</h2><p class="muted mb-4">Sign in to continue shopping.</p>
  <form>
   <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" placeholder="you@example.com" required></div>
   <div class="mb-2"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" placeholder="Enter password" required></div>
   <div class="d-flex justify-content-end mb-4"><a href="forgot-password.html">Forgot password?</a></div>
   <button class="btn btn-primary w-100 py-2" type="submit">Login</button>
  </form>
  <p class="text-center muted mt-4 mb-0">New to ShopNest? <a href="register.html">Create an account</a></p>
 </div></div>
 <p class="text-center mt-3"><a class="muted small" href="index.html">← Back to home</a></p>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
